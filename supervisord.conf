[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/tmp/nginx.log
stderr_logfile=/tmp/nginx.err.log

[program:uvicorn]
command=python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/tmp/uvicorn.log
stderr_logfile=/tmp/uvicorn.err.log
environment=PYTHONUNBUFFERED=1,DATABASE_URL=sqlite:////app/data/notes.db
